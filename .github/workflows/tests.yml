name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the test suite
        run: python3 speakhuman-core/tests/run_tests.py
      - name: Build the zips
        run: python3 scripts/build_zips.py --out="$RUNNER_TEMP/dist"
